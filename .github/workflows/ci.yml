name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LegaciesBot.slnx
      - run: dotnet build LegaciesBot.slnx --no-restore -c Release
      - run: dotnet test LegaciesBot.slnx --no-build -c Release
